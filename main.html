<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px 12px;
        }
    </style>
</head>
<body>

<table>
    <thead>
        <tr>
            <th>Roll number</th>
            <th>Name</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>1</td>
            <td>Shaw</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Adil</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Rahul</td>
        </tr>
    </tbody>
</table>

</body>
</html>
